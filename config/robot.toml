[serial]
# Leave empty to discover the UNO automatically.
port = ""
baudrate = 9600
# Opening a serial port resets the UNO. The factory firmware initializes two
# servos, initializes/calibrates the MPU6050, and then clears its receive buffer.
# Commands sent before that sequence finishes are silently discarded.
reset_delay_seconds = 6.0
# The factory ultrasonic driver can block for about one second when no echo is
# received, so the host deadline must include comfortable margin.
response_timeout_seconds = 2.5

[monitor]
interval_seconds = 0.5

[wifi]
host = "192.168.4.1"
port = 100
connect_timeout_seconds = 3.0
response_timeout_seconds = 2.5

[safety]
maximum_initial_speed = 100
maximum_command_duration_ms = 500
maximum_floor_test_duration_ms = 1500
maximum_differential_floor_test_duration_ms = 3000
teleop_pulse_duration_ms = 250
assisted_pulse_duration_ms = 250
assisted_medium_distance_cm = 30
assisted_medium_pulse_duration_ms = 150
assisted_near_distance_cm = 20
assisted_near_pulse_duration_ms = 75
maximum_assisted_run_seconds = 60.0
obstacle_stop_distance_cm = 15

[drive]
forward_trim_enabled = true
forward_left_pwm = 100
forward_right_pwm = 86
reverse_trim_enabled = true
reverse_left_pwm = -100
reverse_right_pwm = -86
