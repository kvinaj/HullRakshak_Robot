[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hullrakshak-foundation"
version = "0.1.0"
description = "Computer control and telemetry foundation for the ELEGOO Conqueror robot."
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5,<4",
]

[project.scripts]
hullrakshak-calibrate = "hullrakshak.applications.calibrate:main"
hullrakshak-differential-pulse = "hullrakshak.applications.differential_pulse:main"
hullrakshak-pulse = "hullrakshak.applications.motion_test:main"
hullrakshak-serial-diagnostic = "hullrakshak.applications.serial_diagnostic:main"
hullrakshak-sensors = "hullrakshak.applications.sensor_monitor:main"
hullrakshak-teleop = "hullrakshak.applications.teleop:main"

[tool.setuptools]
package-dir = {"" = "host/src"}

[tool.setuptools.packages.find]
where = ["host/src"]
